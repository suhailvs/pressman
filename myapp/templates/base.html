{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>{% block title %}Locations{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{
      --wa-green: #128C7E;
      --wa-green-dark: #075E54;
      --wa-accent: #25D366;
      --wa-bg: #F7F8FA;
      --wa-border: #E9EDEF;
      --wa-text: #111B21;
      --wa-text-muted: #667781;
      --wa-danger: #D64545;
    }

    * { box-sizing: border-box; }
    body{
      background: var(--wa-bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      color: var(--wa-text);
    }

    /* Shared app shell used by every screen */
    .chat-app{
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: #fff;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Shared header bar */
    .chat-header{
      background: var(--wa-green-dark);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .chat-header__title{ font-size: 1.2rem; font-weight: 600; margin: 0; }
    .chat-header__actions{ margin-left: auto; display: flex; gap: 8px; }

    .icon-btn{
      background: transparent; border: none; color: #fff;
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      text-decoration: none;
    }
    .icon-btn:active{ background: rgba(255,255,255,0.15); }

    @media (min-width: 480px){
      .chat-app{ box-shadow: 0 0 24px rgba(0,0,0,0.08); }
    }

    /* Shared form styles (used by add / edit location pages) */
    .add-form{ padding: 24px 20px 40px; }

    .add-form__photo{
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 28px;
    }
    .photo-picker{ position: relative; display: block; cursor: pointer; }
    .photo-picker__preview{
      width: 96px; height: 96px; border-radius: 50%;
      background: var(--wa-border); color: var(--wa-text-muted);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .photo-picker__preview img{ width: 100%; height: 100%; object-fit: cover; }
    .photo-picker__badge{
      position: absolute; bottom: 2px; right: 2px;
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--wa-accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid #fff;
    }
    .add-form__photo input[type="file"]{ display: none; }
    .add-form__photo-hint{ margin: 8px 0 0; font-size: 0.8rem; color: var(--wa-text-muted); }

    .field{ margin-bottom: 18px; }
    .field__label{
      display: block; font-size: 0.78rem; font-weight: 600;
      color: var(--wa-green); text-transform: uppercase; letter-spacing: 0.03em;
      margin-bottom: 6px;
    }
    .field__input{
      width: 100%; border: none; border-bottom: 1.5px solid var(--wa-border);
      padding: 8px 2px; font-size: 1rem; color: var(--wa-text);
      background: transparent; outline: none;
    }
    .field__input:focus{ border-bottom-color: var(--wa-green); }
    .field__error{ color: #d64545; font-size: 0.78rem; margin: 4px 0 0; }

    .field-row{ display: flex; gap: 16px; }
    .field-row .field{ flex: 1; min-width: 0; }

    .alert-error{
      background: #FDEAEA; color: #B3261E; font-size: 0.85rem;
      padding: 10px 14px; border-radius: 8px; margin-bottom: 16px;
    }

    .locate-btn{
      display: flex; align-items: center; gap: 8px;
      background: none; border: none; color: var(--wa-green);
      font-size: 0.88rem; font-weight: 600; padding: 4px 0; margin-bottom: 28px;
    }
    .locate-btn:active{ opacity: 0.7; }

    .save-btn{
      width: 100%; background: var(--wa-green); color: #fff;
      border: none; border-radius: 24px; padding: 14px;
      font-size: 1rem; font-weight: 600;
    }
    .save-btn:active{ background: var(--wa-green-dark); }

    /* Django messages rendered as Bootstrap toasts */
    .wa-toast-container{ z-index: 1080; bottom: max(16px, env(safe-area-inset-bottom, 0px)) !important; }
    .wa-toast{
      min-width: 260px; max-width: 90vw;
      border-radius: 10px; overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      color: #fff;
    }
    .wa-toast .toast-body{ font-size: 0.9rem; font-weight: 500; }
    .wa-toast .btn-close{ filter: invert(1) grayscale(100%) brightness(200%); opacity: 0.9; }
    .wa-toast--success{ background: var(--wa-green); }
    .wa-toast--error{ background: var(--wa-danger); }
    .wa-toast--warning{ background: #B8860B; }
    .wa-toast--info, .wa-toast--debug{ background: var(--wa-green-dark); }

    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>

  <!-- Django messages, rendered as auto-dismissing Bootstrap toasts -->
  {% if messages %}
    <div class="toast-container wa-toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
      {% for message in messages %}
        <div class="toast wa-toast wa-toast--{{ message.tags|default:'info' }}"
             role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="3500">
          <div class="d-flex">
            <div class="toast-body">{{ message }}</div>
            <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
          </div>
        </div>
      {% endfor %}
    </div>
  {% endif %}

  {% block content %}{% endblock %}

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll(".wa-toast").forEach(function (el) {
        new bootstrap.Toast(el).show();
      });
    });
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
